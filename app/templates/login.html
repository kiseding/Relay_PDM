<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · Relay PDM</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login-wrap">
  <form class="login" method="post" action="/login">
    <h1>Relay <span style="font-size:13px;color:#0f766e;font-weight:700;letter-spacing:.06em">PDM</span></h1>
    <div class="sub">一张图，一个真身，一棒一棒传下去。</div>
    {% if err %}<div class="toast err"><span>!</span><div>{{ err }}</div></div>{% endif %}
    <div class="field">
      <label class="fl">账号</label>
      <input type="text" name="username" autofocus autocomplete="username" placeholder="admin">
    </div>
    <div class="field">
      <label class="fl">密码</label>
      <input type="password" name="password" autocomplete="current-password" placeholder="••••••">
    </div>
    <button class="btn primary" style="width:100%;height:36px;margin-top:6px" type="submit">进来</button>
    <div class="accounts">
      演示账号：<b>admin</b> / admin123（管理员）<br>
      sales 李强、design 赵敏、struct 周工、eng 陈工、mold 吴师傅、prod 郑班长 —— 密码都是 <b>123456</b><br>
      审批用 <b>boss</b>（张主管）/ 123456
    </div>
  </form>
</div>
</body>
</html>
